name: Tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - database: SQLite
            test_database_url: ''
          - database: PostgreSQL
            test_database_url: postgresql+psycopg://mgts:mgts_test@127.0.0.1:5432/mgts_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mgts_test
          POSTGRES_USER: mgts
          POSTGRES_PASSWORD: mgts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mgts -d mgts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
        env:
          TEST_DATABASE_URL: ${{ matrix.test_database_url }}
